# Lala TV - Arr Stack
# Deploy on GPU server (gpu-server)
# Jellyfin already runs via systemd (jellyfin-docker.service) - NOT managed here
#
# Media paths:
#   /mnt/media-archive/Movies    → Radarr root + Jellyfin movie library
#   /mnt/media-archive/TV Series → Sonarr root + Jellyfin TV library
#   /mnt/media-archive/Downloads → rdt-client downloads (temp before import)

services:
  # ============================================
  # SONARR - TV Shows Automation
  # ============================================
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /opt/lala-tv/sonarr:/config
      - /mnt/media-archive:/mnt/media-archive
    ports:
      - "8989:8989"
    networks:
      - lala-tv

  # ============================================
  # RADARR - Movies Automation
  # ============================================
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /opt/lala-tv/radarr:/config
      - /mnt/media-archive:/mnt/media-archive
    ports:
      - "7878:7878"
    networks:
      - lala-tv

  # ============================================
  # PROWLARR - Indexer Management
  # ============================================
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /opt/lala-tv/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - lala-tv

  # ============================================
  # RDT-CLIENT - Real-Debrid Torrent Client
  # Replaces qBittorrent, acts as qBit API proxy
  # ============================================
  rdt-client:
    image: rogerfar/rdtclient:latest
    container_name: rdt-client
    restart: unless-stopped
    volumes:
      - /opt/lala-tv/rdt-client:/data/db
      - /mnt/media-archive/Downloads:/data/downloads
    ports:
      - "6500:6500"
    networks:
      - lala-tv

  # ============================================
  # BAZARR - Automated Subtitle Downloads
  # ============================================
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /opt/lala-tv/bazarr:/config
      - /mnt/media-archive:/mnt/media-archive
    ports:
      - "6767:6767"
    networks:
      - lala-tv

  # ============================================
  # TWEAKIO - Torrentio Torznab Proxy
  # Aggregates 12+ public indexers (1337x, YTS,
  # EZTV, RARBG, TPB, etc.) via Torrentio API.
  # No Cloudflare issues. Replaces FlareSolverr.
  # ============================================
  tweakio:
    image: varthe/tweakio:latest
    container_name: tweakio
    restart: unless-stopped
    ports:
      - "3185:3185"
    networks:
      - lala-tv

networks:
  lala-tv:
    name: lala-tv
    driver: bridge
